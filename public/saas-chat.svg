<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1210"/><stop offset="1" stop-color="#0a0f0d"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glc" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.22"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgc)"/>
  <rect width="1280" height="720" fill="url(#glc)"/>
  <g stroke="#ffffff" stroke-opacity="0.04"><path d="M0 180H1280M0 360H1280M0 540H1280M320 0V720M640 0V720M960 0V720"/></g>

  <rect x="80" y="70" width="1120" height="52" rx="12" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="112" cy="96" r="6" fill="#ef4444" fill-opacity="0.6"/><circle cx="134" cy="96" r="6" fill="#f59e0b" fill-opacity="0.6"/><circle cx="156" cy="96" r="6" fill="#10b981" fill-opacity="0.7"/>
  <rect x="200" y="84" width="900" height="24" rx="12" fill="#ffffff" fill-opacity="0.04"/>
  <text x="230" y="101" font-family="monospace" font-size="15" fill="#34d399">saas-chat-application.onrender.com</text>

  <!-- incoming bubble -->
  <g transform="translate(150 190)">
    <rect x="0" y="0" width="380" height="90" rx="22" fill="#ffffff" fill-opacity="0.06"/>
    <path d="M18 82 L2 100 L40 84 Z" fill="#ffffff" fill-opacity="0.06"/>
    <circle cx="44" cy="45" r="18" fill="#34d399" fill-opacity="0.4"/>
    <rect x="78" y="30" width="220" height="12" rx="6" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="78" y="52" width="160" height="12" rx="6" fill="#ffffff" fill-opacity="0.12"/>
  </g>
  <g transform="translate(150 320)">
    <rect x="0" y="0" width="300" height="70" rx="22" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="26" y="22" width="200" height="12" rx="6" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="26" y="44" width="120" height="12" rx="6" fill="#ffffff" fill-opacity="0.12"/>
  </g>

  <!-- outgoing bubbles (emerald) -->
  <g transform="translate(740 250)">
    <rect x="0" y="0" width="390" height="90" rx="22" fill="url(#acc)"/>
    <path d="M372 82 L388 100 L350 84 Z" fill="#059669"/>
    <rect x="30" y="30" width="300" height="12" rx="6" fill="#04160f" fill-opacity="0.5"/>
    <rect x="30" y="52" width="220" height="12" rx="6" fill="#04160f" fill-opacity="0.35"/>
  </g>
  <g transform="translate(830 380)">
    <rect x="0" y="0" width="300" height="70" rx="22" fill="url(#acc)" fill-opacity="0.85"/>
    <rect x="30" y="22" width="220" height="12" rx="6" fill="#04160f" fill-opacity="0.5"/>
    <rect x="30" y="44" width="140" height="12" rx="6" fill="#04160f" fill-opacity="0.35"/>
  </g>

  <!-- typing indicator -->
  <g transform="translate(150 430)">
    <rect x="0" y="0" width="120" height="54" rx="20" fill="#ffffff" fill-opacity="0.06"/>
    <circle cx="36" cy="27" r="7" fill="#34d399"/><circle cx="60" cy="27" r="7" fill="#34d399" fill-opacity="0.6"/><circle cx="84" cy="27" r="7" fill="#34d399" fill-opacity="0.3"/>
  </g>

  <!-- input bar -->
  <g transform="translate(150 520)">
    <rect x="0" y="0" width="980" height="60" rx="30" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="30" y="38" font-family="Inter,sans-serif" font-size="20" fill="#ffffff" fill-opacity="0.3">Type a message…</text>
    <g transform="translate(910 8)"><circle cx="22" cy="22" r="22" fill="url(#acc)"/><path d="M14 22 L30 22 M24 16 L30 22 L24 28" stroke="#04160f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>

  <text x="150" y="640" font-family="Inter,sans-serif" font-size="56" font-weight="800" fill="#ffffff">SaaS Chat</text>
  <text x="152" y="678" font-family="monospace" font-size="22" fill="#34d399">Real-time chat application · Socket.io · Next.js</text>
</svg>
